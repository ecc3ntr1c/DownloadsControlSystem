{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="panel narrow entry">
  <h1>Вход с учётной записью</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
