services:
  postgres:
    image: postgres:16
    container_name: software_control_postgres
    #restart: unless-stopped
    environment:
      POSTGRES_DB: software_control
      POSTGRES_USER: software_control
      POSTGRES_PASSWORD: software_control
    ports:
      - "5432:5432"
    volumes:
      - software_control_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: software_control_redis
    #restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  software_control_postgres_data: